<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Try flow — Web Lite</title>
    <meta name="description" content="flowのタイマーをブラウザで試す。ダウンロード不要。">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="logo.png">
    <!-- Google Analytics (GA4) — same property as the app -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-8K09HFE4HG"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        gtag('config', 'G-8K09HFE4HG');
        function track(name, params){ try { gtag('event', name, params || {}); } catch(e){} }
    </script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        bg: '#121212',
                        surface: '#1E1E1E',
                        teal: { DEFAULT: '#00ADB5' },
                    },
                    fontFamily: { sans: ['Inter', 'sans-serif'] }
                }
            }
        }
    </script>
    <style>
        * { box-sizing: border-box; }
        body { background-color: #121212; color: #fff; min-height: 100dvh; }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #121212; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }

        /* ── Breathing Light ──────────────────────────── */
        .bl-wrap {
            position: relative;
            /* 300px on tablet+; shrinks to fit on narrow phones */
            width: min(300px, calc(100vw - 48px));
            height: min(300px, calc(100vw - 48px));
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        /* Outer corona that breathes */
        .bl-corona {
            position: absolute;
            inset: 0;
            border-radius: 50%;
            background: radial-gradient(circle at center,
                transparent 0%,
                transparent 27%,
                rgba(0, 173, 181, 0.55) 32%,
                rgba(0, 173, 181, 0.15) 45%,
                transparent 60%);
            animation: coronaBreathe 5s ease-in-out infinite;
        }

        /* Ring scales with container (55% of container = same ratio as native app) */
        .bl-ring {
            position: absolute;
            width: 55%;
            height: 55%;
            border-radius: 50%;
            border: 1px solid rgba(0, 173, 181, 0.85);
        }

        /* Timer: scale with viewport, capped at 36px */
        .bl-timer {
            position: relative;
            z-index: 1;
            font-size: clamp(22px, 5.5vw, 36px);
            font-weight: 800;
            color: #00ADB5;
            font-variant-numeric: tabular-nums;
            letter-spacing: 0.03em;
            text-align: center;
            white-space: nowrap;
        }

        @keyframes coronaBreathe {
            0%   { opacity: 0.35; transform: scale(0.88); }
            40%  { opacity: 1.00; transform: scale(1.10); }
            100% { opacity: 0.35; transform: scale(0.88); }
        }

        /* ── Label Chip ───────────────────────────────── */
        .lchip {
            height: 28px;
            border-radius: 14px;
            border: none;
            cursor: pointer;
            font-weight: 600;
            font-size: 11px;
            font-family: inherit;
            transition: all 0.25s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            white-space: nowrap;
            overflow: hidden;
            flex-shrink: 0;
        }

        .lchip.unselected {
            width: 28px;
            padding: 0;
        }

        .lchip.selected {
            padding: 0 10px;
            min-width: 28px;
        }

        /* ── Task Input (pill outline like the app) ───── */
        .task-input {
            width: 100%;
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.4);
            border-radius: 40px;
            padding: 12px 44px 12px 20px;
            color: #fff;
            font-size: 16px;
            font-family: inherit;
            outline: none;
            transition: border-color 0.2s;
        }
        .task-input:focus { border-color: rgba(255,255,255,0.7); }
        .task-input::placeholder { color: rgba(255,255,255,0.35); }

        /* ── Suggestion dropdown ──────────────────────── */
        #suggestions {
            position: absolute;
            top: calc(100% + 4px);
            left: 0; right: 0;
            background: #1E1E1E;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            overflow: hidden;
            z-index: 30;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }

        /* ── Notes textarea ───────────────────────────── */
        .notes-area {
            width: 100%;
            background: transparent;
            border: 1px solid rgba(255,255,255,0.25);
            border-radius: 12px;
            padding: 12px 16px;
            color: #fff;
            font-size: 14px;
            font-family: inherit;
            outline: none;
            resize: none;
            height: 110px;
            transition: border-color 0.2s;
        }
        .notes-area:focus { border-color: rgba(255,255,255,0.5); }
        .notes-area::placeholder { color: rgba(255,255,255,0.25); }

        /* ── Screen transitions ───────────────────────── */
        .screen { display: flex; flex-direction: column; min-height: 100dvh; }
        .screen.hidden { display: none; }
    </style>
</head>

<body class="antialiased">

    <!-- JAVASCRIPT                                          -->
    <!-- ═══════════════════════════════════════════════════ -->
    <script>
        // ── Labels (matching the real app) ─────────────────
        const LABELS = [
            { hex: '#00ADB5', name: 'Work' },
            { hex: '#FF7043', name: 'Study' },
            { hex: '#9C27B0', name: 'Personal' },
            { hex: '#EC407A', name: 'Health' },
        ];

        let selectedLabel = null; // null = none selected
        let timerInterval = null;
        let startTime = null;
        let audioCtx = null;
        let noiseSource = null;
        let gainNode = null;
        let soundOn = false;
        let suggestHideTimer = null;

        // ── Init ────────────────────────────────────────────
        renderLabelChips();
        renderHistory();
        updateTodayTotal();

        // ── Label Chips ─────────────────────────────────────
        function renderLabelChips() {
            const el = document.getElementById('labelChips');
            el.innerHTML = LABELS.map(l => {
                const isSel = selectedLabel?.hex === l.hex;
                const textColor = contrastColor(l.hex);
                return `<button
                    class="lchip ${isSel ? 'selected' : 'unselected'}"
                    style="background-color:${l.hex}; color:${textColor};"
                    onclick="selectLabel('${l.hex}')">
                    ${isSel ? l.name : ''}
                </button>`;
            }).join('');
        }

        function selectLabel(hex) {
            if (selectedLabel?.hex === hex) {
                selectedLabel = null;
            } else {
                selectedLabel = LABELS.find(l => l.hex === hex);
            }
            renderLabelChips();
        }

        function contrastColor(hex) {
            const r = parseInt(hex.slice(1, 3), 16);
            const g = parseInt(hex.slice(3, 5), 16);
            const b = parseInt(hex.slice(5, 7), 16);
            return (0.299 * r + 0.587 * g + 0.114 * b) / 255 > 0.5 ? '#000' : '#fff';
        }

        // ── Timer ────────────────────────────────────────────
        function startTimer() {
            startTime = Date.now();
            timerInterval = setInterval(tick, 500);

            // Set progress screen title
            const title = document.getElementById('taskInput').value.trim() || 'Untitled';
            document.getElementById('progressTitle').textContent = title;

            // Set label chip in progress screen
            const lel = document.getElementById('progressLabel');
            if (selectedLabel) {
                lel.style.backgroundColor = selectedLabel.hex;
                lel.style.color = contrastColor(selectedLabel.hex);
                lel.textContent = selectedLabel.name;
                lel.classList.remove('hidden');
            } else {
                lel.classList.add('hidden');
            }

            document.getElementById('notesArea').value = '';

            // Analytics
            var taskVal = document.getElementById('taskInput').value.trim();
            track('flow_web_session_start', { has_label: !!selectedLabel, has_task: taskVal.length > 0 });

            // Switch screens
            document.getElementById('setupScreen').classList.add('hidden');
            document.getElementById('progressScreen').classList.remove('hidden');

            tick();
        }

        function cancelTimer() {
            if (!confirm('Discard this session?')) return;
            track('flow_web_task_abandoned');
            stopAndReset();
            switchToSetup();
        }

        function finishTimer() {
            const duration = Date.now() - startTime;
            const task = document.getElementById('progressTitle').textContent;
            const notes = document.getElementById('notesArea').value.trim();

            if (duration >= 3000) {
                addToHistory({
                    task,
                    notes,
                    duration,
                    color: selectedLabel?.hex || null,
                    labelName: selectedLabel?.name || null,
                    startedAt: startTime,
                    date: new Date().toDateString(),
                });
                track('flow_web_task_completed', {
                    duration_minutes: Math.floor(duration / 60000),
                    has_label: !!selectedLabel,
                    has_notes: notes.length > 0
                });
            }

            stopAndReset();
            switchToSetup();
            renderHistory();
            updateTodayTotal();
        }

        function stopAndReset() {
            clearInterval(timerInterval);
            timerInterval = null;
            startTime = null;
            document.getElementById('timerDisplay').textContent = '00:00:00';
        }

        function switchToSetup() {
            document.getElementById('progressScreen').classList.add('hidden');
            document.getElementById('setupScreen').classList.remove('hidden');
        }

        function tick() {
            if (!startTime) return;
            document.getElementById('timerDisplay').textContent = formatTime(Date.now() - startTime);
        }

        function formatTime(ms) {
            const s = Math.floor(ms / 1000);
            return `${pad(Math.floor(s / 3600))}:${pad(Math.floor((s % 3600) / 60))}:${pad(s % 60)}`;
        }

        function pad(n) { return String(n).padStart(2, '0'); }

        function formatDuration(ms) {
            const m = Math.floor(ms / 60000);
            if (m < 1) return `${Math.floor(ms / 1000)}s`;
            const h = Math.floor(m / 60);
            return h > 0 ? `${h}h ${m % 60}m` : `${m}m`;
        }

        // ── Task Input ───────────────────────────────────────
        function onTaskInput() {
            const val = document.getElementById('taskInput').value;
            document.getElementById('clearBtn').classList.toggle('hidden', val.length === 0);
            showSuggestions();
        }

        function clearTask() {
            document.getElementById('taskInput').value = '';
            document.getElementById('clearBtn').classList.add('hidden');
            document.getElementById('suggestions').classList.add('hidden');
        }

        function showSuggestions() {
            if (suggestHideTimer) { clearTimeout(suggestHideTimer); suggestHideTimer = null; }
            const val = document.getElementById('taskInput').value.toLowerCase();
            const tasks = getUniqueTasks().filter(t => !val || t.toLowerCase().includes(val));

            const el = document.getElementById('suggestions');
            if (tasks.length === 0) { el.classList.add('hidden'); return; }

            el.innerHTML = tasks.map(t => `
                <button class="w-full text-left px-4 py-3 text-sm text-gray-200 hover:bg-white/10 transition-colors border-b border-white/5 last:border-0"
                    onmousedown="pickSuggestion(this.dataset.v)" data-v="${esc(t)}">${esc(t)}</button>
            `).join('');
            el.classList.remove('hidden');
        }

        function hideSuggestionsDelayed() {
            suggestHideTimer = setTimeout(() => document.getElementById('suggestions').classList.add('hidden'), 150);
        }

        function pickSuggestion(val) {
            const input = document.getElementById('taskInput');
            input.value = val;
            document.getElementById('clearBtn').classList.remove('hidden');
            document.getElementById('suggestions').classList.add('hidden');
        }

        // ── History ──────────────────────────────────────────
        function getHistory() {
            try { return JSON.parse(localStorage.getItem('flow_web_history') || '[]'); }
            catch { return []; }
        }

        function addToHistory(entry) {
            const h = getHistory();
            h.unshift(entry);
            localStorage.setItem('flow_web_history', JSON.stringify(h.slice(0, 30)));
        }

        function clearHistory() {
            localStorage.removeItem('flow_web_history');
            renderHistory();
            updateTodayTotal();
        }

        function getUniqueTasks() {
            return [...new Set(getHistory().map(h => h.task).filter(Boolean))].slice(0, 6);
        }

        function renderHistory() {
            const history = getHistory();
            const list = document.getElementById('historyList');
            const empty = document.getElementById('emptyHistory');

            if (history.length === 0) {
                list.innerHTML = '';
                empty.classList.remove('hidden');
                return;
            }
            empty.classList.add('hidden');

            list.innerHTML = history.slice(0, 8).map(entry => `
                <div class="flex items-center gap-3 p-3 rounded-xl bg-[#1E1E1E]/60 border border-white/5">
                    ${entry.color
                        ? `<span class="lchip selected text-[10px] flex-shrink-0"
                              style="background-color:${entry.color};color:${contrastColor(entry.color)}">
                              ${esc(entry.labelName || '')}
                           </span>`
                        : `<span class="w-2 h-2 rounded-full bg-gray-600 flex-shrink-0"></span>`}
                    <div class="flex-1 min-w-0">
                        <div class="text-sm font-medium truncate">${esc(entry.task)}</div>
                        <div class="text-xs text-gray-500">${new Date(entry.startedAt).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}</div>
                    </div>
                    <div class="text-sm text-gray-400 font-medium flex-shrink-0">${formatDuration(entry.duration)}</div>
                </div>
            `).join('');
        }

        function updateTodayTotal() {
            const today = new Date().toDateString();
            const ms = getHistory().filter(h => h.date === today).reduce((s, h) => s + h.duration, 0);
            const m = Math.floor(ms / 60000);
            document.getElementById('todayTotal').textContent = `${Math.floor(m / 60)}h ${m % 60}m`;
        }

        function esc(s) {
            return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
        }

        // ── Sound ─────────────────────────────────────────────
        function toggleSound() {
            soundOn ? stopSound() : startSound();
        }

        function startSound() {
            try {
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if (audioCtx.state === 'suspended') audioCtx.resume();

                const bufSize = 2 * audioCtx.sampleRate;
                const buf = audioCtx.createBuffer(1, bufSize, audioCtx.sampleRate);
                const data = buf.getChannelData(0);
                let last = 0;
                for (let i = 0; i < bufSize; i++) {
                    const w = Math.random() * 2 - 1;
                    data[i] = (last + 0.02 * w) / 1.02;
                    last = data[i];
                    data[i] *= 3.5;
                }

                if (noiseSource) { try { noiseSource.stop(); } catch(e){} }
                noiseSource = audioCtx.createBufferSource();
                noiseSource.buffer = buf;
                noiseSource.loop = true;

                const filter = audioCtx.createBiquadFilter();
                filter.type = 'lowpass';
                filter.frequency.value = 350;

                gainNode = audioCtx.createGain();
                gainNode.gain.value = 0;

                noiseSource.connect(filter);
                filter.connect(gainNode);
                gainNode.connect(audioCtx.destination);
                noiseSource.start();
                gainNode.gain.linearRampToValueAtTime(0.25, audioCtx.currentTime + 1.5);

                soundOn = true;
                updateSoundUI();
                track('flow_web_sound_toggled', { enabled: true });
            } catch(e) { console.error('Audio:', e); }
        }

        function stopSound() {
            if (gainNode && audioCtx) {
                gainNode.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.5);
                setTimeout(() => { try { noiseSource?.stop(); } catch(e){} noiseSource = null; }, 600);
            }
            soundOn = false;
            updateSoundUI();
            track('flow_web_sound_toggled', { enabled: false });
        }

        function updateSoundUI() {
            document.querySelectorAll('#soundBtn1, #soundBtn2').forEach(btn => {
                if (soundOn) {
                    btn.classList.add('border-teal/50', 'text-teal');
                    btn.classList.remove('border-white/10', 'text-gray-400');
                } else {
                    btn.classList.remove('border-teal/50', 'text-teal');
                    btn.classList.add('border-white/10', 'text-gray-400');
                }
            });
            document.querySelectorAll('.sound-label').forEach(el => {
                el.textContent = soundOn ? 'Playing...' : 'Deep Ocean';
            });
        }

        // Analytics: delegate click listener for Download buttons
        document.addEventListener('click', function(e) {
            var dlEl = e.target.closest('[data-ga-download]');
            if (dlEl) {
                track('flow_web_download_clicked', {
                    store: dlEl.dataset.gaDownload,
                    location: dlEl.dataset.gaLoc || 'unknown'
                });
            }
        });
    </script>

</body>
</html>
